name: Screenshots
# On demand only (9.4.2): the job takes 40-70 min and asserts nothing, so it runs when a UI phase needs
# pictures, not on every push. Start it from the Actions tab or the API; `series` limits which
# configurations are captured (comma-separated names from Tools/ci_screenshots.sh, empty = all).
on:
  workflow_dispatch:
    inputs:
      device:
        description: "Simulator family: iPad or iPhone (iPhone captures portrait and landscape)"
        required: false
        default: iPad
        type: choice
        options: [iPad, iPhone]
      series:
        description: "Comma-separated series (panel_debug,overlay,fullscreen,study,card,furigana,settings,words,review); empty = all"
        required: false
        default: ""
concurrency:
  group: screenshots-${{ github.sha }}-${{ inputs.device }}
  cancel-in-progress: false
jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: Tools/ci_select_xcode.sh
      - name: Capture screenshots
        env:
          SERIES: ${{ inputs.series }}
          DEVICE: ${{ inputs.device }}
        run: Tools/ci_screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ inputs.device }}
          path: build/screenshots/
          retention-days: 14
