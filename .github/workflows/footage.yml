name: Footage analysis
# Runs the OCR pipeline over external gameplay footage. The footage URL lives in the repository secret
# DEMO_FOOTAGE_URL (never in the repo); the video itself is never committed or uploaded as an artifact.
on:
  workflow_dispatch:
    inputs:
      fps:
        description: OCR samples per second of video
        default: "1"
  push:
    paths:
      - "App/Video/VideoAnalyzer.swift"
      - "AppTests/FootageAnalysisTests.swift"
      - ".github/workflows/footage.yml"
concurrency:
  group: footage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      FOOTAGE_URL: ${{ secrets.DEMO_FOOTAGE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Download footage
        id: footage
        run: |
          if [ -z "$FOOTAGE_URL" ]; then echo "DEMO_FOOTAGE_URL secret not set; skipping."; echo "present=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/footage"
          curl -sSL --fail -o "$RUNNER_TEMP/footage/footage.mov" "$FOOTAGE_URL"
          file "$RUNNER_TEMP/footage/footage.mov"
          if ! file "$RUNNER_TEMP/footage/footage.mov" | grep -qiE "quicktime|mp4|iso media"; then echo "::error::download is not a video (check sharing)"; exit 1; fi
          echo "present=true" >> "$GITHUB_OUTPUT"
      - name: Select Xcode
        if: steps.footage.outputs.present == 'true'
        run: Tools/ci_select_xcode.sh
      - name: Analyze footage
        if: steps.footage.outputs.present == 'true'
        env:
          TEST_RUNNER_KOUBUTSU_FOOTAGE: ${{ runner.temp }}/footage/footage.mov
          TEST_RUNNER_KOUBUTSU_FOOTAGE_FPS: ${{ github.event.inputs.fps || '1' }}
          XCODEBUILD_TIME_LIMIT: "5000"
        run: mkdir -p build && Tools/ci_simulator_test.sh test -only-testing:KoubutsuTests/FootageAnalysisTests
      - name: Report
        if: always() && steps.footage.outputs.present == 'true'
        run: |
          mkdir -p build/attachments
          xcrun xcresulttool export attachments --path build/Koubutsu-test.xcresult --output-path build/attachments || true
          find build/attachments -name "*.txt" -exec cat {} \;
      - uses: actions/upload-artifact@v4
        if: always() && steps.footage.outputs.present == 'true'
        with:
          name: footage-report
          path: build/attachments/
          retention-days: 14
